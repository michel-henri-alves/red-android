name: Android CI

on:
  pull_request:
    paths: ["app/**", "gradle/**", "*.gradle.kts", "gradle.properties", "scripts/**", "docs/**", ".github/workflows/android-*.yml"]
  push:
    branches: [main]
    paths: ["app/**", "gradle/**", "*.gradle.kts", "gradle.properties", "scripts/**", "docs/**", ".github/workflows/android-*.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run SDD and contract checks
        run: |
          npm run sdd:check
          npm run contracts:check
      - name: Run tests, coverage and lint
        run: ./gradlew testDebugUnitTest jacocoTestReport lintDebug --stacktrace
      - name: Build debug artifact
        run: ./gradlew assembleDebug --stacktrace
      - name: Upload debug APK and reports
        uses: actions/upload-artifact@v4
        with:
          name: red-android-debug-${{ github.sha }}
          if-no-files-found: error
          retention-days: 1
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/jacoco/jacocoTestReport/jacocoTestReport.xml
            app/build/reports/lint-results-debug.html
            app/build/test-results/testDebugUnitTest/**/*.xml
